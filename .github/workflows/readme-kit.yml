name: readme-kit

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    name: Contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voaneves/dtcg-contrast@v1
        with:
          config: .github/readme-kit/contrast.config.json
          fail-on-error: true
          summary: true

  deploy:
    name: Deploy landing
    needs: contrast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
